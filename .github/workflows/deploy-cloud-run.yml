name: Deploy to Cloud Run

on:
  push:
    branches:
      - portfolio_v01
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portfolio-cloud-run
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: kanishka-portfolio-2026
      REGION: us-west1
      SERVICE: kanishka-portfolio
      IMAGE: us-west1-docker.pkg.dev/kanishka-portfolio-2026/portfolio-images/portfolio

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: kanishka-portfolio-2026
          workload_identity_provider: projects/577264509491/locations/global/workloadIdentityPools/github-actions/providers/portfolio-repo

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure container registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push container
        run: |
          docker build --tag "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Deploy revision
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |
            GOOGLE_GENAI_USE_VERTEXAI=true
            GOOGLE_CLOUD_PROJECT=kanishka-portfolio-2026
            GOOGLE_CLOUD_LOCATION=global
